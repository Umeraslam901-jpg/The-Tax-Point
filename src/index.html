<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My To-Do List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Add a new task..."
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <div class="stats">
            <span id="taskCount">0 tasks</span>
            <span id="completedCount">0 completed</span>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- Todo items will be inserted here -->
        </ul>

        <div class="empty-state" id="emptyState">
            <p>No tasks yet. Add one to get started!</p>
        </div>

        <div class="actions">
            <button id="clearCompleted" class="clear-btn">Clear Completed</button>
            <button id="exportBtn" class="export-btn">Export as JSON</button>
            <button id="importBtn" class="import-btn">Import from JSON</button>
            <input type="file" id="fileInput" accept=".json" style="display: none;">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
